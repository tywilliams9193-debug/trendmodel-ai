<!DOCTYPE html>
<html>
<head>
    <title>TrendModel AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
        }

        input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #0078d4;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #005ea2;
        }

        p {
            color: gray;
        }
    </style>

</head>
<body>

    <div class="container">

        <h1>TrendModel AI</h1>

        <p>
            Generate professional fashion and modeling photos
            powered by AI and daily trends.
        </p>

        <form action="/generate" method="post">

            <input
                type="text"
                name="prompt"
                placeholder="Example: fitness model on Miami beach at sunset"
                required>

            <button type="submit">
                Generate
            </button>

        </form>

    </div>

</body>
</html>
